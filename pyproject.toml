[project]
name = "forge-conversationalist"
version = "0.1.0"
description = "Device-independent LiveKit voice conversation worker"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents[openai,silero,mcp]>=1.8,<1.9",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
mail-streams = ["hatchet-sdk>=1.44,<2"]

[project.scripts]
forge-conversationalist = "forge_conversationalist.agent:main"
forge-conversationalist-audio = "forge_conversationalist.local_audio:main"
forge-conversationalist-ensemble-preflight = "forge_conversationalist.ensemble_preflight:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_conversationalist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
